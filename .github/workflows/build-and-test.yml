name: build-and-test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: librarian
          POSTGRES_PASSWORD: librarian
          POSTGRES_DB: librarian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U librarian"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      LIBRARIAN_TEST_POSTGRES: 'Host=localhost;Port=5432;Database=librarian;Username=librarian;Password=librarian'
      LIBRARIAN_TEST_REDIS: localhost:6379

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Restore tests
        run: dotnet restore test/Soenneker.Librarian.Suite.Tests/Soenneker.Librarian.Suite.Tests.csproj --verbosity minimal

      - name: Build tests
        run: dotnet build test/Soenneker.Librarian.Suite.Tests/Soenneker.Librarian.Suite.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test --project test/Soenneker.Librarian.Suite.Tests/Soenneker.Librarian.Suite.Tests.csproj --configuration Release --no-build --no-restore --verbosity minimal

      - name: Publish Native AOT smoke
        run: dotnet publish test/Soenneker.Librarian.NativeAot.Smoke --configuration Release --runtime linux-x64 --output ./artifacts/native-aot -p:TreatWarningsAsErrors=true -p:IlcTreatWarningsAsErrors=true

      - name: Run Native AOT smoke
        run: ./artifacts/native-aot/Soenneker.Librarian.NativeAot.Smoke

      - name: Pack
        shell: bash
        run: |
          for project in src/*/*.csproj; do
            [[ "$project" == *Soenneker.Librarian.Website* ]] && continue
            dotnet pack "$project" --configuration Release --no-build --no-restore --output ./artifacts --verbosity minimal
          done
