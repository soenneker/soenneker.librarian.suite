name: publish-package

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'test/**'
      - 'benchmarks/**'
      - 'src/Soenneker.Librarian.Website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip

jobs:
  publish-package:
    runs-on: ubuntu-latest

    services:
      couchdb:
        image: couchdb:3.5.2
        env:
          COUCHDB_USER: librarian
          COUCHDB_PASSWORD: librarian
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl --fail http://localhost:5984/_up"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: librarian
          POSTGRES_PASSWORD: librarian
          POSTGRES_DB: librarian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U librarian"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      LIBRARIAN_TEST_COUCHDB: http://localhost:5984
      LIBRARIAN_TEST_COUCHDB_USERNAME: librarian
      LIBRARIAN_TEST_COUCHDB_PASSWORD: librarian
      LIBRARIAN_TEST_POSTGRES: 'Host=localhost;Port=5432;Database=librarian;Username=librarian;Password=librarian'
      LIBRARIAN_TEST_REDIS: localhost:6379
      LIBRARIAN_TEST_MONGO: 'mongodb://localhost:27017/?replicaSet=librarian&directConnection=true'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setting up build version
        shell: bash
        run: |
          echo "BUILD_VERSION=4.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Get release notes from latest commit
        uses: soenneker/release-notes-from-commits@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Start MongoDB replica set
        shell: bash
        run: |
          docker run -d --name librarian-mongo -p 27017:27017 mongo:8 --replSet librarian --bind_ip_all
          for attempt in {1..60}; do
            docker exec librarian-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' && break
            sleep 1
          done
          docker exec librarian-mongo mongosh --quiet --eval 'rs.initiate({_id:"librarian",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in {1..60}; do
            if docker exec librarian-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Restore tests
        run: dotnet restore test/Soenneker.Librarian.Suite.Tests/Soenneker.Librarian.Suite.Tests.csproj --verbosity minimal

      - name: Build tests
        run: dotnet build test/Soenneker.Librarian.Suite.Tests/Soenneker.Librarian.Suite.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: dotnet test --project test/Soenneker.Librarian.Suite.Tests/Soenneker.Librarian.Suite.Tests.csproj --configuration Release --no-build --no-restore --verbosity normal

      - name: Test remote providers
        run: dotnet test --project test/Soenneker.Librarian.Remote.Tests --configuration Release -- --treenode-filter "/*/*/*/*"

      - name: Test generator
        run: dotnet test --project test/Soenneker.Librarian.Generators.Tests --configuration Release

      - name: Pack individual NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          packages=(
            Soenneker.Librarian.Abstractions
            Soenneker.Librarian.Core
            Soenneker.Librarian.Memory
            Soenneker.Librarian.Browser
            Soenneker.Librarian.LocalStorage
            Soenneker.Librarian.SessionStorage
            Soenneker.Librarian.IndexedDb
            Soenneker.Librarian.Maui.Secure
            Soenneker.Librarian.FileSystem
            Soenneker.Librarian.Redis
            Soenneker.Librarian.Postgres
            Soenneker.Librarian.Mongo
            Soenneker.Librarian.Cosmos
            Soenneker.Librarian.D1
            Soenneker.Librarian.AzureBlob
            Soenneker.Librarian.R2
            Soenneker.Librarian.Kv
            Soenneker.Librarian.Turbopuffer
            Soenneker.Librarian.Generators
          )

          for package in "${packages[@]}"; do
            dotnet pack "src/$package/$package.csproj" \
              --configuration Release \
              --no-build \
              --no-restore \
              --output ./artifacts
            test -f "artifacts/$package.$BUILD_VERSION.nupkg"
          done

      - name: Log in to NuGet
        uses: soenneker/nuget-resilient-login@v7
        id: nuget-login
        with:
          user: soenneker

      - name: Publish to NuGet
        uses: soenneker/nuget-resilient-publish@v4
        with:
          api-key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          packages: 'artifacts/*.nupkg'

      - name: Publish to GitHub Packages
        shell: bash
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/soenneker/index.json" \
            --api-key "${{ secrets.GH__TOKEN }}" \
            --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH__TOKEN }}
        shell: bash
        run: |
          printf '%s\n' "$PACKAGE_RELEASE_NOTES" > release-notes.txt
          gh release create "v$BUILD_VERSION" \
            --title "v$BUILD_VERSION" \
            --notes-file release-notes.txt
